
<!DOCTYPE html>
<html>
<head>
    <title>MicroCloud Observability</title>

    <style>
			body {
    			font-family: Arial, sans-serif;
    			background-color: #f5f5f5;
    			padding: 40px;
			}

			h1 {
    			text-align: center;
    			margin-bottom: 40px;
			}

			.graph {
    			margin-bottom: 50px;
			}

			.node {
    			background: white;
    			border: 2px solid #333;
    			border-radius: 10px;
    			padding: 16px;
    			width: 320px;
    			margin: auto;
    			text-align: center;
    			font-size: 20px;
    			font-weight: bold;
			}

			.dependencies {
    			margin-top: 24px;
    			display: flex;
    			flex-direction: column;
    			align-items: center;
    			gap: 12px;
			}

			.dependency {
    			background: white;
    			border: 1px solid #888;
    			border-radius: 8px;
    			padding: 12px;
    			width: 280px;
    			text-align: center;
			}
    </style>
</head>

<body>

<h1>Dependency Graph</h1>

        <div class="graph">

            <div class="node">
                executive
            </div>

            <div class="dependencies">
    
            <div class="dependency">
                vm_cpu_usage_seconds_rate
            </div>
        
            <div class="dependency">
                vm_disk_read_bytes_rate
            </div>
        
            <div class="dependency">
                vm_disk_write_bytes_rate
            </div>
        
            <div class="dependency">
                vm_memory_usage_bytes
            </div>
        
            <div class="dependency">
                vm_test_metric
            </div>
        
            <div class="dependency">
                vm_test_watch
            </div>
        
            <div class="dependency">
                vm_network_rx_bytes_rate
            </div>
        
            <div class="dependency">
                vm_network_tx_bytes_rate
            </div>
        
            </div>

        </div>
    
		<script>

		setInterval(
		function () {

		window.location.reload()

		},
		5000,
		)

		</script>

</body>
</html>
